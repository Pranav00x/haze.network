<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6bd72"/>
      <stop offset="55%" stop-color="#ef9a3d"/>
      <stop offset="100%" stop-color="#d47a1e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Brand mark: a left-half-filled circle (mirrors the "◖" glyph used
       as the text brand-mark across the wallet/explorer/marketplace UIs) -
       dark ink on the vibrant amber field so it reads clearly at any size,
       including a 27px nav icon. -->
  <g transform="translate(256 256)">
    <circle r="132" fill="none" stroke="#1b1408" stroke-width="16" opacity="0.9"/>
    <path d="M 0 -132 A 132 132 0 0 0 0 132 Z" fill="#1b1408"/>
  </g>
</svg>
